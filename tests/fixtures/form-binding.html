<!doctype html><meta charset="utf-8"><title>Fictional form binding test</title>
<h1 id="job">Fictional role A</h1>
<p>Local synthetic fixture. No submission or network requests. Use demo-profile.json only.</p>
<div id="form-host"></div>
<p>Schedule a change, then scan/confirm in the extension within 8 seconds:</p>
<button id="url">Same origin, navigate to URL B in 8s</button>
<button id="spa">Same URL, replace job and identical form in 8s</button>
<button id="title">Same URL, change job heading in 8s</button>
<button id="race">Replace remaining form on first input</button>
<p>For tab switching, scan then switch to another tab. For unchanged control, reload and do not schedule a change.</p>
<script>
const markup='<form id="application" aria-label="Fictional application" onsubmit="return false"><p><label>姓名<input id="name" name="full_name" autocomplete="name"></label></p><p><label>Email address<input id="email" name="email" type="email" autocomplete="email"></label></p><p><label>Visa sponsorship<input id="visa" name="visa"></label></p><p><label>Work authorization<input id="permit" name="permit"></label></p></form>';
const host=document.getElementById('form-host');host.innerHTML=markup;
if(new URL(location.href).searchParams.get('job')==='B')document.getElementById('job').textContent='Fictional role B';
document.getElementById('url').onclick=()=>setTimeout(()=>{location.href='?job=B';},8000);
document.getElementById('spa').onclick=()=>setTimeout(()=>{document.getElementById('job').textContent='Fictional role B';host.innerHTML=markup;},8000);
document.getElementById('title').onclick=()=>setTimeout(()=>{document.getElementById('job').textContent='Fictional role B';},8000);
document.getElementById('race').onclick=()=>document.getElementById('name').addEventListener('input',()=>{host.innerHTML=markup;},{once:true});
</script>
