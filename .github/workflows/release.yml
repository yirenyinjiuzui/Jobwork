name: Publish Jobwork release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and run tests
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version extension/manifest.json)" = "$version"
          test -s "docs/releases/$version.md"
          grep -Fq "$version" README.md
          grep -Fq "$version" web/index.html
          python -m unittest discover -s tests
          node --test tests/test_*.mjs
      - name: Build and verify packages
        shell: bash
        run: |
          out="$RUNNER_TEMP/jobwork-release"
          python tools/build_release.py --output "$out"
          python tools/package_parts.py "$out/job-workbench-v$(cat VERSION).zip"
          (cd "$out" && sha256sum -c SHA256SUMS.txt)
      - name: Publish packages at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(cat VERSION)
          tag="v$version"
          out="$RUNNER_TEMP/jobwork-release"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
              gh release download "$tag" --dir "$RUNNER_TEMP/published"
              (cd "$RUNNER_TEMP/published" && sha256sum -c SHA256SUMS.txt)
              exit 0
            fi
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            existing=$(git ls-remote --tags origin "refs/tags/$tag")
            if [ -n "$existing" ]; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
            fi
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "求职工作台 $version" --notes-file "docs/releases/$version.md"
          fi
          gh release upload "$tag" "$out"/* --clobber
          gh release edit "$tag" --draft=false
